services:
  app:
    build: .
    profiles:
      - app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookmanager
      - SPRING_DATASOURCE_USERNAME=bookmanager
      - SPRING_DATASOURCE_PASSWORD=bookmanager
      - SPRING_CLOUD_AWS_ENDPOINT=http://ministack:4566
      - SPRING_CLOUD_AWS_REGION_STATIC=ap-northeast-1
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=test
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=test
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: true

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=bookmanager
      - POSTGRES_USER=bookmanager
      - POSTGRES_PASSWORD=bookmanager
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookmanager']
      interval: 5s
      timeout: 3s
      retries: 5

  ministack:
    image: ministackorg/ministack:latest
    environment:
      - MINISTACK_REGION=ap-northeast-1
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4566/_ministack/health'', timeout=3)"']
      interval: 5s
      timeout: 3s
      retries: 10
