spring.application.name=bookmanager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookmanager}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookmanager}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jooq.sql-dialect=postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.cloud.aws.endpoint=${SPRING_CLOUD_AWS_ENDPOINT:http://localhost:4566}
spring.cloud.aws.region.static=${SPRING_CLOUD_AWS_REGION_STATIC:ap-northeast-1}
spring.cloud.aws.credentials.access-key=${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:test}
spring.cloud.aws.credentials.secret-key=${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:test}
bookmanager.messaging.author-registration.queue-name=bookmanager-author-registration
bookmanager.messaging.author-registration.enabled=true
bookmanager.idempotency.ttl=${BOOKMANAGER_IDEMPOTENCY_TTL:PT1H}
